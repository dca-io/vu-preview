<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>DBMR Analyzer</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Native appliance framebuffer is 1920x720; scale uniformly to fit. */
  #canvas {
    width: 100vw;
    height: calc(100vw * 720 / 1920);
    max-height: 100vh;
    max-width: calc(100vh * 1920 / 720);
    display: block;
    touch-action: none;
  }
  #status {
    position: fixed;
    left: 8px;
    bottom: 8px;
    color: #666;
    font: 12px/1.4 monospace;
  }
</style>
</head>
<body>
<canvas id="canvas" width="1920" height="720" oncontextmenu="return false"></canvas>
<div id="status"></div>
<script>
  var statusElement = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (text) { console.log(text); },
    printErr: function (text) {
      /* The renderers write routine diagnostics to stderr with a [TAG]
       * prefix; only untagged lines are failures worth pinning on screen. */
      console.error(text);
      if (!/^\[/.test(text)) {
        statusElement.textContent = text;
      }
    }
  };
</script>
<script src="dbmr-analyzer-web.js"></script>
</body>
</html>
